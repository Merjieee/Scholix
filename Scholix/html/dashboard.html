<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../assets/favicon.png?v=2" type="image/png" />

  <title data-mgx-overview="title">Dashboard · Scholix</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body class="dash-body">
  <a class="skip-link" href="#viewRoot">Skip to dashboard content</a>

  <div class="dash" id="dashShell" hidden>
    <!-- Sidebar -->
    <aside class="dash__side" id="dashSide">
      <div class="dash__side-head">
        <div class="brand">
          <img class="brand__mark" src="../assets/favicon.png" alt="" />
          <span class="brand__text">Scholix</span>
        </div>
        <button class="icon-btn dash__side-close" type="button" id="sideClose" aria-label="Close navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>

      <nav class="dash__nav" id="dashNav" aria-label="Dashboard sections"></nav>

      <div class="sidebar-account" id="sidebarAccount" role="group" aria-label="Signed-in account"></div>
    </aside>

    <!-- Main -->
    <div class="dash__main">
      <header class="dashbar">
        <button class="icon-btn dashbar__menu" type="button" id="sideOpen" aria-label="Open navigation" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18" /><path d="M3 12h18" /><path d="M3 18h18" /></svg>
        </button>

        <div class="notification-wrap">
          <button class="icon-btn notification-trigger" type="button" id="notificationTrigger" aria-label="Notifications" aria-expanded="false" aria-controls="notificationPanel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" /><path d="M10 21h4" /></svg>
            <span class="notification-dot" hidden></span>
          </button>
          <section class="notification-panel" id="notificationPanel" aria-label="Notifications" hidden>
            <div class="notification-panel__head">
              <h2>Notifications</h2>
              <button class="notification-mark-all" type="button" id="notificationMarkAll" hidden>Mark all read</button>
            </div>
            <div class="notification-list" id="notificationList"></div>
          </section>
        </div>

        <div class="dashbar__user">
          <span class="avatar" id="userAvatar" aria-hidden="true">--</span>
          <span class="dashbar__user-text">
            <strong id="userName">—</strong>
            <span class="role-badge" id="userRole">—</span>
          </span>
        </div>
      </header>

      <main class="dash__content" id="viewRoot"></main>
    </div>
  </div>

  <!-- Student form modal (administrator only) -->
  <div class="modal" id="studentModal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog modal__dialog--student" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__head">
        <div>
          <p class="eyebrow" id="modalEyebrow">New record</p>
          <h2 id="modalTitle">Add a student</h2>
        </div>
        <button class="icon-btn" type="button" id="modalClose" data-close-modal aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>

      <form class="modal__form" id="studentForm" novalidate>
        <div class="field-grid field-grid--student">
          <div class="field field--wide">
            <label for="f-name">Full name <span aria-hidden="true">*</span></label>
            <input id="f-name" name="name" type="text" required autocomplete="off" placeholder="e.g. Jamie Rivera" />
            <p class="field__error" data-error-for="name" hidden></p>
          </div>

          <div class="field">
            <label for="f-roll">Roll number <span aria-hidden="true">*</span></label>
            <input id="f-roll" name="roll" type="text" required placeholder="e.g. 7A-014" />
            <p class="field__error" data-error-for="roll" hidden></p>
          </div>

          <div class="field">
            <label for="f-grade-trigger">Grade <span aria-hidden="true">*</span></label>
            <div id="f-grade-select"></div>
            <p class="field__error" data-error-for="grade" hidden></p>
          </div>

          <div class="field">
            <label for="f-guardian">Guardian name <span aria-hidden="true">*</span></label>
            <input id="f-guardian" name="guardian" type="text" required placeholder="e.g. Taylor Morgan" />
            <p class="field__error" data-error-for="guardian" hidden></p>
          </div>

          <div class="field">
            <label for="f-phone">Guardian phone <span aria-hidden="true">*</span></label>
            <input id="f-phone" name="phone" type="tel" required placeholder="e.g. +1 415 555 0134" />
            <p class="field__error" data-error-for="phone" hidden></p>
          </div>

          <div class="field">
            <label for="f-attendance">Attendance % <span aria-hidden="true">*</span></label>
            <input id="f-attendance" name="attendance" type="number" min="0" max="100" step="0.1" required placeholder="0 – 100" />
            <p class="field__error" data-error-for="attendance" hidden></p>
          </div>

          <div class="field">
            <label for="f-feeStatus-trigger">Fee status <span aria-hidden="true">*</span></label>
            <div id="f-feeStatus-select"></div>
            <p class="field__error" data-error-for="feeStatus" hidden></p>
          </div>

          <div class="field">
            <label for="f-due">Outstanding amount</label>
            <input id="f-due" name="due" type="number" min="0" step="1" placeholder="0" />
            <p class="field__error" data-error-for="due" hidden></p>
          </div>

          <div class="field field--wide">
            <label for="f-email">Email (optional)</label>
            <input id="f-email" name="email" type="email" placeholder="student@scholix.com" />
            <p class="field__error" data-error-for="email" hidden></p>
          </div>
        </div>

        <div class="modal__foot">
          <button class="btn btn--ghost" type="button" data-close-modal>Cancel</button>
          <button class="btn btn--primary" type="submit" id="modalSubmit">Save student</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Multi-select existing student records for a section. -->
  <div class="modal" id="assignStudentModal" hidden>
    <div class="modal__backdrop" data-close-assign-students></div>
    <div class="modal__dialog modal__dialog--assign" role="dialog" aria-modal="true" aria-labelledby="assignStudentTitle" aria-describedby="assignStudentDescription">
      <div class="modal__head">
        <div>
          <p class="eyebrow" id="assignStudentEyebrow">Section assignment</p>
          <h2 id="assignStudentTitle">Assign students</h2>
        </div>
        <button class="icon-btn" type="button" data-close-assign-students aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>
      <form class="modal__form modal__form--assign" id="assignStudentForm">
        <p class="assign-student-description" id="assignStudentDescription"></p>
        <div class="assign-student-list-head">
          <label class="assign-student-select-all"><input type="checkbox" id="assignStudentSelectAll"><span>Select all available</span></label>
          <span id="assignStudentSelectionCount" aria-live="polite">0 selected</span>
        </div>
        <div class="assign-student-list" id="assignStudentOptions" role="group" aria-label="Available students"></div>
        <div class="modal__foot">
          <button class="btn btn--ghost assign-student-reset" type="button" data-reset-assign-students>Reset</button>
          <button class="btn btn--primary" type="submit" id="assignStudentSubmit" disabled>Assign students</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Enrolled student list for a saved section -->
  <div class="modal" id="sectionStudentsModal" hidden>
    <div class="modal__backdrop" data-close-section-students></div>
    <div class="modal__dialog modal__dialog--section-students" role="dialog" aria-modal="true" aria-labelledby="sectionStudentsTitle" aria-describedby="sectionStudentsDescription">
      <div class="modal__head">
        <div>
          <p class="eyebrow" id="sectionStudentsEyebrow">Section roster</p>
          <h2 id="sectionStudentsTitle">Enrolled students</h2>
        </div>
        <button class="icon-btn" type="button" data-close-section-students aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>
      <div class="modal__form modal__form--section-students">
        <p class="section-students-description" id="sectionStudentsDescription"></p>
        <div class="section-students-list" id="sectionStudentsList"></div>
      </div>
    </div>
  </div>

  <!-- Confirmation dialog -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal__backdrop" data-confirm-cancel></div>
    <div class="modal__dialog modal__dialog--sm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <div class="confirm">
        <h2 id="confirmTitle">Are you sure?</h2>
        <p class="confirm__text" id="confirmText"></p>
        <div class="modal__foot">
          <button class="btn btn--ghost" type="button" data-confirm-cancel>Cancel</button>
          <button class="btn btn--primary confirm__danger" type="button" data-confirm-ok id="confirmOk">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-hidden="true"></div>
  <p class="sr-only" role="status" aria-live="polite" id="liveRegion"></p>

  <script type="module" src="../js/dashboard.js"></script>
</body>

</html>
